<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayush's Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @keyframes rainbowBG {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes rainbowText {
      0%   { color: #ff0000; }
      14%  { color: #ff7700; }
      28%  { color: #ffff00; }
      42%  { color: #00cc00; }
      57%  { color: #0099ff; }
      71%  { color: #6600ff; }
      85%  { color: #ff00cc; }
      100% { color: #ff0000; }
    }

    @keyframes borderRainbow {
      0%   { border-color: #ff0000; }
      16%  { border-color: #ff7700; }
      33%  { border-color: #ffff00; }
      50%  { border-color: #00cc00; }
      66%  { border-color: #0099ff; }
      83%  { border-color: #6600ff; }
      100% { border-color: #ff0000; }
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(270deg, #ff0000, #ff7700, #ffff00, #00cc00, #0099ff, #6600ff, #ff00cc, #ff0000);
      background-size: 400% 400%;
      animation: rainbowBG 8s ease infinite;
      min-height: 100vh;
      color: #fff;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.3);
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      animation: rainbowText 3s linear infinite;
    }

    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      border: 2px solid #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem;
    }

    .hero {
      text-align: center;
      padding: 80px 20px 40px;
    }

    .greeting {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 2px 2px 12px rgba(0,0,0,0.5);
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.5);
      margin-bottom: 60px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 40px 60px;
    }

    .card {
      background: rgba(0, 0, 0, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      padding: 28px 24px;
      backdrop-filter: blur(8px);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: borderRainbow 3s linear infinite;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }

    .card-icon { font-size: 2rem; margin-bottom: 14px; }

    .card-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }

    .card-value {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.4);
    }

    .card-delta {
      font-size: 0.85rem;
      color: #ccffcc;
      margin-top: 6px;
      font-weight: 600;
    }

    .clock {
      text-align: center;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.85);
      font-weight: 600;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
      padding-bottom: 24px;
    }

    .reminder-banner {
      max-width: 480px;
      margin: 0 auto 60px;
      background: rgba(0,0,0,0.4);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 14px;
      padding: 18px 28px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.4);
      animation: borderRainbow 3s linear infinite;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ayush's Dashboard</h1>
    <div class="avatar">A</div>
  </header>

  <main>
    <section class="hero">
      <div class="greeting" id="greeting">Pratham</div>
      <p class="subtitle">Meet me tomorrow at 1 PM</p>
    </section>

    <div class="cards">
      <div class="card">
        <div class="card-icon">📈</div>
        <div class="card-label">Total Revenue</div>
        <div class="card-value">$84,320</div>
        <div class="card-delta">+12.5% this month</div>
      </div>
      <div class="card">
        <div class="card-icon">👥</div>
        <div class="card-label">Active Users</div>
        <div class="card-value">3,241</div>
        <div class="card-delta">+8.1% this week</div>
      </div>
      <div class="card">
        <div class="card-icon">🛒</div>
        <div class="card-label">New Orders</div>
        <div class="card-value">128</div>
        <div class="card-delta">+3.4% today</div>
      </div>
      <div class="card">
        <div class="card-icon">⭐</div>
        <div class="card-label">Satisfaction</div>
        <div class="card-value">98%</div>
        <div class="card-delta">All-time high</div>
      </div>
    </div>

    <p class="clock" id="clock"></p>

    <div class="reminder-banner">
      📅 Connect with me tomorrow at 1 PM
    </div>
  </main>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) +
        '  •  ' +
        now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
